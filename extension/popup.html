<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 330px; margin: 0; padding: 12px 14px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #2b211c; background: #fbf6ef; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #8a6f5c; margin: 14px 0 6px; }
  .status { padding: 6px 8px; border-radius: 6px; background: #eee3d6; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .status.ok { background: #d8f0dc; }
  .status.err { background: #f8dcdc; }
  label { display: block; margin: 4px 0; }
  input[type=text], input[type=password], input[type=number] { box-sizing: border-box; width: 100%; padding: 4px 6px; border: 1px solid #cdbba8; border-radius: 5px; background: #fff; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 70px; gap: 6px; align-items: end; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 5px 10px; border: 1px solid #b89c84; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #8c6d55; color: #fff; border-color: #8c6d55; }
  button:hover { filter: brightness(.95); }
  small { color: #8a6f5c; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow: auto; }
  li { padding: 3px 0; border-bottom: 1px solid #eadfd2; display: flex; justify-content: space-between; gap: 8px; }
  li .a { white-space: nowrap; }
  #saved { color: #3b8a4a; margin-left: 6px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: #8a6f5c; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  pre { white-space: pre-wrap; word-break: break-word; font: 11px/1.45 Consolas, monospace; background: #fff; border: 1px solid #eadfd2; border-radius: 6px; padding: 6px 8px; margin: 6px 0 0; }
  .note { margin: 6px 0; padding: 7px 9px; border-radius: 6px; background: #fff3d6; border: 1px solid #ecd39a; color: #5a4320; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; }
  header h1 { margin: 0; }
  .langs { display: flex; gap: 6px; }
  .langs button { padding: 0; border: 0; background: none; line-height: 0; border-radius: 3px; opacity: .35; transition: opacity .15s; }
  .langs button:hover { opacity: .7; filter: none; }
  .langs button.on { opacity: 1; box-shadow: 0 0 0 2px #8c6d55; }
  .langs svg { width: 24px; height: 16px; border-radius: 2px; display: block; }
</style>
</head>
<body>
  <header>
    <h1>🍄 Mushroom Kids</h1>
    <div class="langs">
      <button data-lang="en" title="English"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="uk"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
      <button data-lang="vi" title="Tiếng Việt"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#DA251D"/><polygon fill="#FF0" points="15,4 16.76,9.43 22.47,9.43 17.85,12.79 19.61,18.21 15,14.86 10.39,18.21 12.15,12.79 7.53,9.43 13.24,9.43"/></svg></button>
    </div>
  </header>
  <p class="note" id="update" hidden></p>
  <div id="status" class="status"><span id="statusText">…</span><button id="reconnect" data-i18n-title="reconnect">↻</button></div>

  <h2 data-i18n="tryIt"></h2>
  <label><span data-i18n="bubbleName"></span> <input type="text" id="testUser" value="Phi"></label>
  <div class="btns">
    <button data-sim="feed">🍪 Feed</button>
    <button data-sim="cuddle">🤗 Cuddle</button>
    <button data-sim="hf0">✋ High five</button>
    <button data-sim="reset" data-i18n="resetWarmth"></button>
  </div>

  <h2 data-i18n="triggers"></h2>
  <div class="row"><label><span data-i18n="itemFeed"></span> <input type="text" id="feedLabel"></label><label><span data-i18n="price"></span> <input type="number" id="feedAmount" min="0"></label></div>
  <div class="row"><label><span data-i18n="itemCuddle"></span> <input type="text" id="cuddleLabel"></label><label><span data-i18n="price"></span> <input type="number" id="cuddleAmount" min="0"></label></div>
  <div class="row"><label><span data-i18n="itemHf0"></span> <input type="text" id="hf0Label"></label><label><span data-i18n="price"></span> <input type="number" id="hf0Amount" min="0"></label></div>
  <p class="note" data-i18n="triggersHelp"></p>
  <small data-i18n="priceHelp"></small>

  <h2 data-i18n="gauge"></h2>
  <div class="row"><label data-i18n="fullAt"></label><label><span data-i18n="tokens"></span> <input type="number" id="heatMax" min="1"></label></div>
  <small data-i18n="gaugeHelp"></small>

  <h2>OBS</h2>
  <div class="row"><label><span data-i18n="password"></span> <input type="password" id="obsPassword"></label><label><span data-i18n="port"></span> <input type="number" id="obsPort"></label></div>
  <div class="btns" style="margin-top:8px"><button class="primary" id="save" data-i18n="save"></button><span id="saved"></span></div>

  <h2 data-i18n="latest"></h2>
  <ul id="log"></ul>

  <details id="diagBox">
    <summary data-i18n="diag"></summary>
    <small data-i18n="diagHelp"></small>
    <pre id="diagText"></pre>
  </details>

  <script src="popup.js"></script>
</body>
</html>
